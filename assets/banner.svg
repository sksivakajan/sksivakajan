<!-- assets/banner.svg -->
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300">
  <defs>
    <!-- Dark background -->
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#040005"/>
      <stop offset="1" stop-color="#000000"/>
    </linearGradient>

    <!-- Red neon glow -->
    <filter id="redGlow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="2.4" result="b"/>
      <feColorMatrix in="b" type="matrix"
        values="1 0 0 0 0
                0 0.15 0 0 0
                0 0 0.15 0 0
                0 0 0 1 0" result="c"/>
      <feMerge>
        <feMergeNode in="c"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- White glow for text -->
    <filter id="whiteGlow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Scanlines -->
    <pattern id="scan" width="6" height="6" patternUnits="userSpaceOnUse">
      <rect width="6" height="2" fill="rgba(255,255,255,0.03)"/>
      <rect y="3" width="6" height="1" fill="rgba(255,255,255,0.015)"/>
    </pattern>

    <!-- Vignette -->
    <radialGradient id="vig" cx="50%" cy="45%" r="75%">
      <stop offset="0" stop-color="rgba(0,0,0,0)"/>
      <stop offset="1" stop-color="rgba(0,0,0,0.7)"/>
    </radialGradient>

    <style>
      .mono { font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Arial; }
      .title { font-size: 74px; font-weight: 900; letter-spacing: 1px; }
      .sub { font-size: 22px; font-weight: 500; opacity: 0.92; }
      .about { font-size: 18px; opacity: 0.85; }
      .small { font-size: 16px; opacity: 0.75; }

      /* Moving scanlines */
      @keyframes scanMove {
        0% { transform: translateY(-10px); opacity: .45; }
        50% { opacity: .75; }
        100% { transform: translateY(10px); opacity: .45; }
      }
      .scanMove { animation: scanMove 3.2s ease-in-out infinite; }

      /* Name pulse */
      @keyframes pulse {
        0%,100% { transform: scale(1); opacity: 1; }
        50% { transform: scale(1.01); opacity: 0.95; }
      }
      .pulse { animation: pulse 2.6s ease-in-out infinite; transform-origin: center; }

      /* Glitch jitter */
      @keyframes glitch {
        0%{transform:translate(0,0)}
        10%{transform:translate(-2px,1px)}
        20%{transform:translate(2px,-1px)}
        30%{transform:translate(-3px,0)}
        40%{transform:translate(3px,1px)}
        50%{transform:translate(0,0)}
        60%{transform:translate(2px,0)}
        70%{transform:translate(-1px,1px)}
        80%{transform:translate(1px,0)}
        90%{transform:translate(-2px,-1px)}
        100%{transform:translate(0,0)}
      }
      .glitch { animation: glitch 1.8s steps(2,end) infinite; }

      /* Cursor blink */
      @keyframes blink { 0%,49%{opacity:1} 50%,100%{opacity:0} }
      .cursor { animation: blink 0.9s steps(2,end) infinite; }

      /* “Typing” reveal using clip-path */
      @keyframes reveal {
        0% { clip-path: inset(0 100% 0 0); }
        60% { clip-path: inset(0 0 0 0); }
        100% { clip-path: inset(0 0 0 0); }
      }
      .typing { animation: reveal 3.2s steps(34,end) infinite; }

      /* Cycle multiple skill lines */
      .l0, .l1, .l2, .l3 { opacity: 0; }
      @keyframes cycle { 0%,19%{opacity:1} 25%,100%{opacity:0} }
      .l0 { animation: cycle 12s infinite; }
      .l1 { animation: cycle 12s infinite; animation-delay: 3s; }
      .l2 { animation: cycle 12s infinite; animation-delay: 6s; }
      .l3 { animation: cycle 12s infinite; animation-delay: 9s; }

      /* Laser line motion */
      @keyframes dash { to { stroke-dashoffset: -1200; } }
      .laser { stroke-dasharray: 8 18; animation: dash 6s linear infinite; }

      @keyframes driftA { 0%{transform:translate(0,0)} 50%{transform:translate(-20px,10px)} 100%{transform:translate(0,0)} }
      @keyframes driftB { 0%{transform:translate(0,0)} 50%{transform:translate(25px,-12px)} 100%{transform:translate(0,0)} }
      .driftA { animation: driftA 7s ease-in-out infinite; }
      .driftB { animation: driftB 8s ease-in-out infinite; }
    </style>
  </defs>

  <!-- Background -->
  <rect width="1200" height="300" fill="url(#bg)"/>

  <!-- Red laser network (moving groups) -->
  <g filter="url(#redGlow)" opacity="0.95">
    <g class="driftA">
      <path class="laser" d="M-50 40 L250 10 L420 90 L620 25 L820 110 L1030 40 L1260 70"
            fill="none" stroke="#ff1a1a" stroke-width="2.6"/>
      <path class="laser" d="M40 260 L230 180 L420 235 L610 150 L760 210 L980 160 L1220 240"
            fill="none" stroke="#ff1a1a" stroke-width="2.4"/>
      <path class="laser" d="M120 30 L180 130 L60 210 L210 280"
            fill="none" stroke="#ff1a1a" stroke-width="2.2"/>
      <path class="laser" d="M470 0 L520 120 L430 210 L560 300"
            fill="none" stroke="#ff1a1a" stroke-width="2.2"/>
      <path class="laser" d="M860 0 L760 120 L900 220 L820 300"
            fill="none" stroke="#ff1a1a" stroke-width="2.2"/>
      <path class="laser" d="M1100 10 L1020 120 L1160 220 L1050 300"
            fill="none" stroke="#ff1a1a" stroke-width="2.2"/>

      <!-- Nodes -->
      <g fill="#ff3b3b">
        <circle cx="250" cy="10" r="3"/>
        <circle cx="420" cy="90" r="3"/>
        <circle cx="620" cy="25" r="3"/>
        <circle cx="820" cy="110" r="3"/>
        <circle cx="230" cy="180" r="3"/>
        <circle cx="420" cy="235" r="3"/>
        <circle cx="610" cy="150" r="3"/>
        <circle cx="980" cy="160" r="3"/>
      </g>
    </g>

    <g class="driftB" opacity="0.85">
      <path class="laser" d="M-40 120 L140 80 L320 140 L500 70 L690 150 L900 95 L1260 120"
            fill="none" stroke="#ff0000" stroke-width="2.0"/>
      <path class="laser" d="M-30 200 L170 240 L380 200 L560 260 L760 200 L980 240 L1260 210"
            fill="none" stroke="#ff0000" stroke-width="2.0"/>
    </g>
  </g>

  <!-- Red wave lines -->
  <g filter="url(#redGlow)" opacity="0.65">
    <path d="M-40 160 C120 120, 240 220, 380 170 C520 120, 620 220, 760 170 C900 120, 1020 220, 1260 150"
          fill="none" stroke="#ff2a2a" stroke-width="2">
      <animate attributeName="d" dur="4.5s" repeatCount="indefinite"
        values="
        M-40 160 C120 120, 240 220, 380 170 C520 120, 620 220, 760 170 C900 120, 1020 220, 1260 150;
        M-40 170 C120 220, 240 120, 380 180 C520 230, 620 120, 760 190 C900 240, 1020 120, 1260 165;
        M-40 160 C120 120, 240 220, 380 170 C520 120, 620 220, 760 170 C900 120, 1020 220, 1260 150
        "/>
    </path>

    <path d="M-40 210 C140 170, 260 260, 410 210 C560 160, 680 260, 830 215 C980 170, 1100 250, 1260 205"
          fill="none" stroke="#ff1515" stroke-width="1.8" opacity="0.7">
      <animate attributeName="d" dur="5.2s" repeatCount="indefinite"
        values="
        M-40 210 C140 170, 260 260, 410 210 C560 160, 680 260, 830 215 C980 170, 1100 250, 1260 205;
        M-40 195 C140 250, 260 165, 410 230 C560 175, 680 250, 830 190 C980 240, 1100 170, 1260 220;
        M-40 210 C140 170, 260 260, 410 210 C560 160, 680 260, 830 215 C980 170, 1100 250, 1260 205
        "/>
    </path>
  </g>

  <!-- Dark overlay to make text readable -->
  <rect x="0" y="0" width="1200" height="300" fill="rgba(0,0,0,0.28)"/>

  <!-- Moving scanlines -->
  <g class="scanMove">
    <rect width="1200" height="300" fill="url(#scan)" opacity="0.85"/>
  </g>

  <!-- Main title + info -->
  <g transform="translate(80,140)" class="mono">
    <!-- Name glow layers -->
    <g class="pulse">
      <text x="2" y="0" class="title" fill="rgba(255,0,120,0.25)" filter="url(#whiteGlow)">Kajan Sivaraja</text>
      <text x="-2" y="2" class="title" fill="rgba(0,255,255,0.20)" filter="url(#whiteGlow)">Kajan Sivaraja</text>

      <text x="0" y="0" class="title glitch" fill="#ffffff" filter="url(#whiteGlow)">Kajan Sivaraja</text>
    </g>

    <text x="6" y="44" class="sub" fill="rgba(255,255,255,0.92)">
      BSc (Hons) IT Cyber Security • eJPT • ICCA
    </text>

    <text x="6" y="86" class="about" fill="rgba(255,255,255,0.85)">
      Passionate about ethical hacking, network defense, and AI-driven security systems.
    </text>

    <!-- Typing skills -->
    <text x="6" y="124" class="small" fill="rgba(255,255,255,0.86)">
      root@portfolio:~$ <tspan fill="rgba(255,255,255,0.65)">skills</tspan> :
      <tspan class="l0 typing" xml:space="preserve"> Penetration Testing • Network Security</tspan>
      <tspan class="l1 typing" xml:space="preserve"> Kali Linux • SOC Fundamentals</tspan>
      <tspan class="l2 typing" xml:space="preserve"> Python • Security Automation</tspan>
      <tspan class="l3 typing" xml:space="preserve"> Web Security • OWASP • Bug Hunting</tspan>
      <tspan class="cursor">█</tspan>
    </text>
  </g>

  <!-- Bottom contact (edit these) -->
  <g class="mono" transform="translate(80,270)">
    <text x="0" y="0" fill="rgba(255,255,255,0.7)" font-size="14">
      SIVAKAJAN07@GMAIL.COM  •  WWW.SIVARAJAKAJAN.LK  •  linkedin.com/in/sivakajan
    </text>
  </g>

  <!-- Vignette -->
  <rect width="1200" height="300" fill="url(#vig)"/>
</svg>