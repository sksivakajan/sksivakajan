<!-- assets/banner.svg (clean layout) -->
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300">
  <defs>
    <!-- Background -->
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#040007"/>
      <stop offset="1" stop-color="#000000"/>
    </linearGradient>

    <!-- Red glow -->
    <filter id="redGlow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="2.2" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- White text glow -->
    <filter id="whiteGlow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="3.2" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Scanlines pattern -->
    <pattern id="scan" width="6" height="6" patternUnits="userSpaceOnUse">
      <rect width="6" height="2" fill="rgba(255,255,255,0.03)"/>
      <rect y="3" width="6" height="1" fill="rgba(255,255,255,0.015)"/>
    </pattern>

    <!-- Vignette -->
    <radialGradient id="vig" cx="45%" cy="45%" r="80%">
      <stop offset="0" stop-color="rgba(0,0,0,0)"/>
      <stop offset="1" stop-color="rgba(0,0,0,0.72)"/>
    </radialGradient>

    <style>
      .ui { font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Arial; }
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace; }

      .name { font-size: 72px; font-weight: 900; letter-spacing: 0.5px; }
      .deg  { font-size: 20px; font-weight: 600; opacity: .92; }
      .about{ font-size: 17px; opacity: .88; }
      .line { font-size: 16px; opacity: .92; }
      .muted{ opacity: .72; }

      /* Moving scanlines */
      @keyframes scanMove { 0%{transform:translateY(-10px);opacity:.45} 50%{opacity:.75} 100%{transform:translateY(10px);opacity:.45} }
      .scanMove { animation: scanMove 3.4s ease-in-out infinite; }

      /* Laser dash motion */
      @keyframes dash { to { stroke-dashoffset: -1200; } }
      .laser { stroke-dasharray: 9 16; animation: dash 6.5s linear infinite; }

      @keyframes driftA { 0%{transform:translate(0,0)} 50%{transform:translate(-18px,10px)} 100%{transform:translate(0,0)} }
      @keyframes driftB { 0%{transform:translate(0,0)} 50%{transform:translate(22px,-12px)} 100%{transform:translate(0,0)} }
      .driftA { animation: driftA 7.2s ease-in-out infinite; }
      .driftB { animation: driftB 8.1s ease-in-out infinite; }

      /* Wave motion */
      @keyframes waveShift { 0%{transform:translateX(0)} 50%{transform:translateX(-25px)} 100%{transform:translateX(0)} }
      .waveShift { animation: waveShift 5.5s ease-in-out infinite; }

      /* Name subtle pulse */
      @keyframes pulse { 0%,100%{transform:scale(1)} 50%{transform:scale(1.01)} }
      .pulse { animation: pulse 2.6s ease-in-out infinite; transform-origin:left center; }

      /* Glitch jitter */
      @keyframes glitch {
        0%{transform:translate(0,0)} 12%{transform:translate(-2px,1px)}
        24%{transform:translate(2px,-1px)} 36%{transform:translate(-3px,0)}
        48%{transform:translate(3px,1px)} 60%{transform:translate(0,0)}
        72%{transform:translate(2px,0)} 84%{transform:translate(-1px,1px)}
        100%{transform:translate(0,0)}
      }
      .glitch { animation: glitch 1.9s steps(2,end) infinite; }

      /* Cursor blink */
      @keyframes blink { 0%,49%{opacity:1} 50%,100%{opacity:0} }
      .cursor { animation: blink 0.9s steps(2,end) infinite; }

      /* Typing reveal */
      @keyframes reveal { 0%{clip-path:inset(0 100% 0 0)} 60%{clip-path:inset(0 0 0 0)} 100%{clip-path:inset(0 0 0 0)} }
      .typing { animation: reveal 3.0s steps(34,end) infinite; }

      /* Cycle skill lines (one at a time) */
      .l0,.l1,.l2,.l3{opacity:0}
      @keyframes cycle { 0%,20%{opacity:1} 26%,100%{opacity:0} }
      .l0{animation:cycle 12s infinite}
      .l1{animation:cycle 12s infinite;animation-delay:3s}
      .l2{animation:cycle 12s infinite;animation-delay:6s}
      .l3{animation:cycle 12s infinite;animation-delay:9s}
    </style>
  </defs>

  <!-- Background -->
  <rect width="1200" height="300" fill="url(#bg)"/>

  <!-- Red network lines (kept behind content) -->
  <g filter="url(#redGlow)" opacity="0.8">
    <g class="driftA">
      <path class="laser" d="M-80 42 L220 10 L420 90 L640 25 L860 110 L1060 42 L1280 78"
            fill="none" stroke="#ff1a1a" stroke-width="2.4"/>
      <path class="laser" d="M-60 250 L220 185 L420 235 L640 150 L820 215 L1020 160 L1280 245"
            fill="none" stroke="#ff1a1a" stroke-width="2.2"/>
      <path class="laser" d="M120 18 L190 120 L70 210 L230 285"
            fill="none" stroke="#ff1a1a" stroke-width="2.0"/>
      <path class="laser" d="M470 0 L535 120 L440 215 L570 300"
            fill="none" stroke="#ff1a1a" stroke-width="2.0"/>
      <path class="laser" d="M880 0 L770 120 L910 220 L830 300"
            fill="none" stroke="#ff1a1a" stroke-width="2.0"/>
      <g fill="#ff3b3b">
        <circle cx="220" cy="10" r="3"/>
        <circle cx="420" cy="90" r="3"/>
        <circle cx="640" cy="25" r="3"/>
        <circle cx="860" cy="110" r="3"/>
        <circle cx="220" cy="185" r="3"/>
        <circle cx="420" cy="235" r="3"/>
        <circle cx="640" cy="150" r="3"/>
        <circle cx="1020" cy="160" r="3"/>
      </g>
    </g>

    <g class="driftB" opacity="0.75">
      <path class="laser" d="M-60 115 L150 75 L340 140 L520 70 L720 150 L940 95 L1280 120"
            fill="none" stroke="#ff0000" stroke-width="1.9"/>
      <path class="laser" d="M-60 195 L180 240 L380 200 L560 260 L780 200 L1000 240 L1280 210"
            fill="none" stroke="#ff0000" stroke-width="1.9"/>
    </g>
  </g>

  <!-- Red wave line -->
  <g class="waveShift" filter="url(#redGlow)" opacity="0.55">
    <path d="M-50 165 C120 130, 260 215, 410 175 C560 135, 700 215, 850 175 C1000 135, 1120 215, 1260 160"
          fill="none" stroke="#ff2a2a" stroke-width="2">
      <animate attributeName="d" dur="4.8s" repeatCount="indefinite"
        values="
        M-50 165 C120 130, 260 215, 410 175 C560 135, 700 215, 850 175 C1000 135, 1120 215, 1260 160;
        M-50 175 C120 220, 260 130, 410 185 C560 230, 700 135, 850 195 C1000 240, 1120 140, 1260 170;
        M-50 165 C120 130, 260 215, 410 175 C560 135, 700 215, 850 175 C1000 135, 1120 215, 1260 160
        "/>
    </path>
  </g>

  <!-- Glass panel (THIS fixes readability + layout) -->
  <rect x="40" y="55" width="1120" height="190" rx="18" fill="rgba(0,0,0,0.55)" stroke="rgba(255,255,255,0.08)"/>

  <!-- Scanlines only on panel -->
  <g class="scanMove">
    <rect x="40" y="55" width="1120" height="190" rx="18" fill="url(#scan)" opacity="0.8"/>
  </g>

  <!-- Content area (safe padding) -->
  <g transform="translate(85,118)" class="ui">
    <!-- Name with clean glow -->
    <g class="pulse" filter="url(#whiteGlow)">
      <text x="2" y="0" class="name" fill="rgba(255,0,120,0.20)">KAJAN SIVARAJA</text>
      <text x="-2" y="2" class="name" fill="rgba(0,255,255,0.16)">KAJAN SIVARAJA</text>
      <text x="0" y="0" class="name glitch" fill="#ffffff">KAJAN SIVARAJA</text>
    </g>

    <!-- Degree + cert -->
    <text x="2" y="42" class="deg" fill="rgba(255,255,255,0.92)">
      BSc (Hons) Information Technology — Specializing in Cyber Security • eJPT • ICCA
    </text>

    <!-- About (single clear line) -->
    <text x="2" y="74" class="about" fill="rgba(255,255,255,0.86)">
      Passionate about ethical hacking, network defense, and AI-driven security systems.
    </text>

    <!-- Skills typing line (always visible position, no overlap) -->
    <text x="2" y="112" class="mono line" fill="rgba(255,255,255,0.90)">
      root@portfolio:~$ <tspan class="muted">skills</tspan> :
      <tspan class="l0 typing" xml:space="preserve"> Penetration Testing • Network Security</tspan>
      <tspan class="l1 typing" xml:space="preserve"> Kali Linux • SOC Fundamentals</tspan>
      <tspan class="l2 typing" xml:space="preserve"> Python • Security Automation</tspan>
      <tspan class="l3 typing" xml:space="preserve"> Web Security • OWASP • Bug Hunting</tspan>
      <tspan class="cursor">█</tspan>
    </text>






    <!-- Contact on separate line (no overlap) -->
    <text x="2" y="145" class="mono" font-size="14" fill="rgba(255,255,255,0.70)">
      sivakajan07@gmail.com  •  sivarajakajan.lk  •  linkedin.com/in/sivakajan
    </text>
  </g>

  <!-- Vignette -->
  <rect width="1200" height="300" fill="url(#vig)"/>
</svg>