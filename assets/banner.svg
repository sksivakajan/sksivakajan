<!-- assets/banner.svg -->
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300">
  <defs>
    <!-- Background -->
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#020504"/>
      <stop offset="1" stop-color="#000000"/>
    </linearGradient>

    <!-- Glow -->
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="2.6" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Scanlines pattern -->
    <pattern id="scan" width="6" height="6" patternUnits="userSpaceOnUse">
      <rect width="6" height="2" fill="rgba(0,255,136,0.05)"/>
      <rect y="3" width="6" height="1" fill="rgba(0,255,136,0.02)"/>
    </pattern>

    <!-- Vignette -->
    <radialGradient id="vig" cx="50%" cy="45%" r="70%">
      <stop offset="0" stop-color="rgba(0,0,0,0)"/>
      <stop offset="1" stop-color="rgba(0,0,0,0.65)"/>
    </radialGradient>

    <style>
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace; }
      .name { font-size: 62px; font-weight: 900; fill:#00ff88; letter-spacing: 1px; }
      .sub  { font-size: 20px; fill: rgba(0,255,136,0.78); }
      .cert { font-size: 18px; fill: rgba(0,255,136,0.55); }
      .dim  { fill: rgba(0,255,136,0.28); }

      /* Cursor blink */
      @keyframes blink { 0%,49%{opacity:1} 50%,100%{opacity:0} }
      .cursor { animation: blink 0.9s steps(2,end) infinite; }

      /* Slight float */
      @keyframes floaty { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-3px)} }
      .float { animation: floaty 4s ease-in-out infinite; transform-origin:center; }

      /* Subtle glitch jitter */
      @keyframes jitter {
        0%{transform:translate(0,0)} 10%{transform:translate(-1px,0)}
        20%{transform:translate(2px,0)} 30%{transform:translate(-2px,1px)}
        40%{transform:translate(1px,-1px)} 50%{transform:translate(0,0)}
        60%{transform:translate(2px,0)} 70%{transform:translate(-1px,1px)}
        80%{transform:translate(1px,0)} 90%{transform:translate(-2px,-1px)}
        100%{transform:translate(0,0)}
      }
      .jitter { animation: jitter 1.6s steps(2,end) infinite; }

      /* Typing: we switch between pre-made lines */
      .t0, .t1, .t2, .t3 { opacity: 0; }
      @keyframes cycle {
        0%, 19% { opacity: 1; }
        25%, 100% { opacity: 0; }
      }
      .t0 { animation: cycle 12s infinite; }
      .t1 { animation: cycle 12s infinite; animation-delay: 3s; }
      .t2 { animation: cycle 12s infinite; animation-delay: 6s; }
      .t3 { animation: cycle 12s infinite; animation-delay: 9s; }

      /* Type reveal with mask (per line) */
      @keyframes reveal {
        0% { clip-path: inset(0 100% 0 0); }
        60% { clip-path: inset(0 0 0 0); }
        100% { clip-path: inset(0 0 0 0); }
      }
      .reveal { animation: reveal 3s steps(30,end) infinite; }

      /* Moving scanlines */
      @keyframes scanMove {
        0% { transform: translateY(-12px); opacity: .55; }
        50% { opacity: .8; }
        100% { transform: translateY(12px); opacity: .55; }
      }
      .scanMove { animation: scanMove 3.2s ease-in-out infinite; }
    </style>
  </defs>

  <!-- Background -->
  <rect width="1200" height="300" fill="url(#bg)"/>

  <!-- Matrix rain -->
  <g class="mono" font-size="18" fill="#00ff88" opacity="0.22" filter="url(#glow)">
    <text x="70"  y="-80">1010011010010110100101101010
      <animate attributeName="y" dur="3.0s" values="-120;360" repeatCount="indefinite"/>
    </text>
    <text x="250" y="-140">0100110010100101101001100101
      <animate attributeName="y" dur="3.6s" values="-170;390" repeatCount="indefinite"/>
    </text>
    <text x="460" y="-90">1100101010010110010100101011
      <animate attributeName="y" dur="2.9s" values="-120;360" repeatCount="indefinite"/>
    </text>
    <text x="680" y="-170">0110100101100101011001010010
      <animate attributeName="y" dur="4.1s" values="-200;410" repeatCount="indefinite"/>
    </text>
    <text x="910" y="-120">1011010010110010100101100101
      <animate attributeName="y" dur="3.2s" values="-150;380" repeatCount="indefinite"/>
    </text>
  </g>

  <!-- Terminal frame -->
  <rect x="24" y="20" width="1152" height="260" rx="18" fill="rgba(0,0,0,0.35)" stroke="rgba(0,255,136,0.23)"/>
  <rect x="24" y="20" width="1152" height="40" rx="18" fill="rgba(0,0,0,0.55)" stroke="rgba(0,255,136,0.16)"/>
  <circle cx="56" cy="40" r="6" fill="#ff5f56"/>
  <circle cx="76" cy="40" r="6" fill="#ffbd2e"/>
  <circle cx="96" cy="40" r="6" fill="#27c93f"/>
  <text x="120" y="45" class="mono dim" font-size="14">root@github:~#</text>

  <!-- Readability overlay -->
  <rect x="24" y="60" width="1152" height="220" rx="16" fill="rgba(0,0,0,0.58)"/>

  <!-- Moving scanlines overlay -->
  <g class="scanMove">
    <rect x="24" y="60" width="1152" height="220" rx="16" fill="url(#scan)" opacity="0.85"/>
  </g>

  <!-- Kali-style neon "dragon" icon (simple vector, not official logo file) -->
  <g transform="translate(980,98) scale(1.0)" filter="url(#glow)" opacity="0.95">
    <path d="M95 8
             C72 10, 55 28, 50 48
             C43 77, 63 98, 88 104
             C71 106, 52 98, 43 84
             C37 106, 51 128, 73 136
             C92 143, 114 136, 127 122
             C141 106, 144 84, 133 66
             C124 52, 107 40, 90 39
             C104 30, 122 33, 133 44
             C132 26, 116 12, 95 8 Z"
          fill="none" stroke="#00ff88" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M78 58 C86 52, 98 52, 106 58" fill="none" stroke="rgba(0,255,136,0.7)" stroke-width="3" stroke-linecap="round"/>
    <circle cx="86" cy="50" r="3" fill="#00ff88"/>
    <text x="0" y="170" class="mono" font-size="16" fill="rgba(0,255,136,0.6)">KALI MODE</text>
  </g>

  <!-- Main text -->
  <g transform="translate(70,150)" class="mono float" filter="url(#glow)">
    <!-- Glitch layers -->
    <text x="2" y="0" class="name" fill="rgba(0,255,255,0.35)">KAJAN SIVARAJA</text>
    <text x="-2" y="2" class="name" fill="rgba(255,0,140,0.25)">KAJAN SIVARAJA</text>

    <!-- Real name -->
    <text x="0" y="0" class="name jitter">KAJAN SIVARAJA</text>

    <!-- Qualification -->
    <text x="0" y="44" class="sub">
      BSc (Hons) Information Technology — Specializing in Cyber Security
    </text>

    <!-- Certifications -->
    <text x="0" y="74" class="cert">
      Certified: eJPT • ICCA
    </text>

    <!-- Typing skills line (cycles) -->
    <text x="0" y="112" class="sub">
      root@github:~# <tspan class="dim">skills</tspan> =
      <tspan class="t0 reveal" xml:space="preserve"> Network Security • Penetration Testing</tspan>
      <tspan class="t1 reveal" xml:space="preserve"> Linux (Kali) • SOC Fundamentals</tspan>
      <tspan class="t2 reveal" xml:space="preserve"> Python • Security Automation</tspan>
      <tspan class="t3 reveal" xml:space="preserve"> Web Security • OWASP • Bug Hunting</tspan>
      <tspan class="cursor">█</tspan>
    </text>
  </g>

  <!-- Vignette -->
  <rect width="1200" height="300" fill="url(#vig)"/>
</svg>