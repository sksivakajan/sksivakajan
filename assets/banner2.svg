<!-- assets/banner2.svg -->
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#040007"/>
      <stop offset="1" stop-color="#000000"/>
    </linearGradient>

    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="2.5"/>
    </filter>

    <style>
      .name { font-size:72px; font-weight:900; fill:white; font-family:Arial;}
      .sub { font-size:20px; fill:rgba(255,255,255,0.9); font-family:Arial;}
      .small { font-size:16px; fill:rgba(255,255,255,0.8); font-family:Arial;}

      @keyframes float1 {0%,100%{transform:translateY(0)}50%{transform:translateY(-12px)}}
      @keyframes float2 {0%,100%{transform:translateY(0)}50%{transform:translateY(12px)}}
      @keyframes float3 {0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}

      .f1 { animation:float1 4s ease-in-out infinite;}
      .f2 { animation:float2 5s ease-in-out infinite;}
      .f3 { animation:float3 6s ease-in-out infinite;}

      @keyframes pulse {0%,100%{transform:scale(1)}50%{transform:scale(1.02)}}
      .pulse { animation:pulse 2.6s infinite;}

      @keyframes dash {to{stroke-dashoffset:-1000}}
      .laser {stroke-dasharray:8 14; animation:dash 6s linear infinite;}
    </style>
  </defs>

  <!-- background -->
  <rect width="1200" height="300" fill="url(#bg)"/>

  <!-- red cyber lines -->
  <g opacity="0.6">
    <path class="laser" d="M0 60 L300 20 L600 80 L900 40 L1200 70"
      stroke="#ff1a1a" stroke-width="2" fill="none"/>
    <path class="laser" d="M0 240 L250 200 L550 260 L850 210 L1200 250"
      stroke="#ff1a1a" stroke-width="2" fill="none"/>
  </g>

  <!-- TEXT -->
  <g transform="translate(80,150)">
    <text class="name pulse" filter="url(#glow)">KAJAN SIVARAJA</text>
    <text y="40" class="sub">BSc (Hons) Cyber Security • eJPT • ICCA</text>
    <text y="80" class="small">Ethical Hacking • Penetration Testing • Security Research</text>
  </g>

  <!-- SKILL LOGOS -->
  <g transform="translate(820,70) scale(0.9)">

    <!-- Kali -->
    <g class="f1">
      <image href="https://upload.wikimedia.org/wikipedia/commons/2/2b/Kali-dragon-icon.svg"
             width="60" height="60"/>
    </g>

    <!-- Python -->
    <g transform="translate(120,0)" class="f2">
      <image href="https://upload.wikimedia.org/wikipedia/commons/c/c3/Python-logo-notext.svg"
             width="60" height="60"/>
    </g>

    <!-- Burp -->
    <g transform="translate(240,0)" class="f3">
      <image href="https://portswigger.net/burp/favicon.ico"
             width="60" height="60"/>
    </g>

    <!-- Metasploit -->
    <g transform="translate(0,110)" class="f2">
      <image href="https://upload.wikimedia.org/wikipedia/commons/4/4f/Metasploit_logo_and_wordmark.svg"
             width="60" height="60"/>
    </g>

    <!-- Wireshark -->
    <g transform="translate(120,110)" class="f1">
      <image href="https://upload.wikimedia.org/wikipedia/commons/d/db/Wireshark_Logo.svg"
             width="60" height="60"/>
    </g>

    <!-- Linux -->
    <g transform="translate(240,110)" class="f3">
      <image href="https://upload.wikimedia.org/wikipedia/commons/a/af/Tux.png"
             width="60" height="60"/>
    </g>

  </g>
</svg>